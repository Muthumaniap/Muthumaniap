<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img"><rect width="1200" height="280" rx="18" fill="#101820"/><rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="#28383d"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="14" fill="#c5f277" letter-spacing="2">01 / DOCUMENT AI / PROMANTUS</text><text x="34" y="100" font-family="Arial,sans-serif" font-size="34" fill="#f1f3e9" font-weight="700">Engineering diagrams. Structured intelligence.</text><text x="34" y="146" font-family="Arial,sans-serif" font-size="21" fill="#bac7c8" >Built an end-to-end P&amp;ID digitization pipeline combining symbol detection,</text><text x="34" y="174" font-family="Arial,sans-serif" font-size="21" fill="#bac7c8" >text and table extraction, and structured storage. Fine-tuned models and</text><text x="34" y="202" font-family="Arial,sans-serif" font-size="21" fill="#bac7c8" >connected the processing stages through reusable, orchestrated workflows.</text><path d="M34 222H1166" stroke="#2b3b40"/><text x="34" y="255" font-family="Arial,sans-serif" font-size="16" fill="#c5f277" >Faster R-CNN · OCR · Multimodal LLMs · PostgreSQL · Prefect</text></svg>